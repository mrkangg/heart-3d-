<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หัวใจ 3D — Chrome/iPad</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#030b14;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;z-index:3;left:14px;top:14px;width:290px;padding:14px;background:#061a2bed;border:1px solid #2a6689;border-radius:15px;box-shadow:0 12px 40px #0008}
h1{margin:0 0 5px;font-size:24px}p{font-size:12px;color:#bfd0df;line-height:1.5}label{font-size:12px}input{width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}button{padding:9px;border-radius:9px;border:1px solid #2c6382;background:#0d3046;color:#fff}
#info{position:fixed;z-index:4;right:14px;top:14px;width:260px;padding:12px;background:#061a2bed;border:1px solid #2a6689;border-radius:15px;font-size:12px;line-height:1.5}
#info b{font-size:15px}@media(max-width:700px){#info{display:none}#ui{width:230px;left:8px;top:8px}h1{font-size:20px}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui"><h1>🫀 หัวใจ 3D</h1><p>เวอร์ชันไม่ใช้ Three.js — เปิดได้โดยตรงบน Chrome/iPad</p>
<label>ระดับการผ่า</label><input id="cut" type="range" min="0" max="100" value="0">
<div class="row"><button id="ex">✦ แยกห้อง</button><button id="flow">🩸 เลือดไหล</button><button id="auto">⟳ อัตโนมัติ</button><button id="reset">↺ รีเซ็ต</button></div></div>
<div id="info"><b>โมเดลหัวใจ 3D</b><br>ลากเพื่อหมุน • ล้อ/สองนิ้วเพื่อซูม<br>เลื่อนการผ่าเพื่อเปิดดู 4 ห้องหัวใจ</div>
<script>
(()=>{const C=document.getElementById('cv'),x=C.getContext('2d'),cut=document.getElementById('cut');let W,H,dpr,ry=.25,rx=-.05,drag=false,lx,ly,zoom=1,ex=false,flow=false,auto=false;
const rooms=[{x:-.48,y:.25,z:.32,sx:.48,sy:.58,c:'#2b91df'},{x:-.45,y:-.55,z:.36,sx:.57,sy:.86,c:'#247dc2'},{x:.48,y:.27,z:.32,sx:.46,sy:.56,c:'#e65361'},{x:.45,y:-.58,z:.38,sx:.60,sy:.95,c:'#d84252'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function heart2(t){let a=t*Math.PI*2;return [16*Math.sin(a)**3,13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a)]}
function rot(p){let[X,Y,Z]=p,cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),a=X*cy-Z*sy,b=X*sy+Z*cy,c=Y*cx-b*sx,d=Y*sx+b*cx;return[a,d,c]}
function P(p){let q=rot(p),s=Math.min(W,H)*.055*zoom;return[W/2+q[0]*s,H/2-q[1]*s,q[2]]}
function poly(points,fill){x.beginPath();points.forEach((p,i)=>{let q=P(p);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.closePath();x.fillStyle=fill;x.fill()}
function drawShell(){let layers=18,depth=1.35,cv=+cut.value/100;for(let k=0;k<layers;k++){let z=-depth/2+depth*k/(layers-1),pts=[];for(let i=0;i<100;i++){let h=heart2(i/100);pts.push([h[0]/10,h[1]/10-.2,z])}if(cv>0){let left=pts.filter(p=>p[0]<(0.95-cv*2.0));if(left.length>3)pts=left}let shade=Math.round(145+70*k/layers);poly(pts,'rgb('+shade+',55,70)')}}
function drawRoom(r){let d=ex?.48:0,p=[r.x+(r.x<0?-d:d),r.y,r.z],q=P(p),s=Math.min(W,H)*.055*zoom,rxp=r.sx*s,ryp=r.sy*s,g=x.createRadialGradient(q[0]-rxp*.25,q[1]-ryp*.3,2,q[0],q[1],Math.max(rxp,ryp));g.addColorStop(0,'#fff8');g.addColorStop(.2,r.c);g.addColorStop(1,r.c+'cc');x.beginPath();x.ellipse(q[0],q[1],rxp,ryp,0,0,Math.PI*2);x.fillStyle=g;x.fill();x.strokeStyle='#ffffff44';x.stroke()}
function vessel(px,py,pz,rx,ry,c){let q=P([px,py,pz]),s=Math.min(W,H)*.055*zoom;x.beginPath();x.ellipse(q[0],q[1],rx*s,ry*s,0,0,Math.PI*2);x.fillStyle=c;x.fill()}
function drawFlow(now){if(!flow)return;for(let i=0;i<18;i++){let tt=((now/1800+i/18)%1),blue=i%2===0,path=blue?[[-1,1,.5],[-.45,.2,.55],[-.45,-.55,.55],[-.45,1.4,.5]]:[[.45,-.55,.55],[.45,.3,.55],[.5,1.5,.5],[1.25,.2,.4]],z=tt*3,si=Math.min(2,Math.floor(z)),f=z-si,a=path[si],b=path[si+1],q=P([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]);x.beginPath();x.arc(q[0],q[1],4,0,Math.PI*2);x.fillStyle=blue?'#55b9ff':'#ff7180';x.fill()}}
function render(now){x.clearRect(0,0,W,H);if(auto)ry+=.006;drawShell();vessel(.5,1.7,.3,.28,.55,'#e65361');vessel(-.5,1.55,.3,.25,.5,'#2b91df');rooms.slice().sort((a,b)=>rot([a.x,a.y,a.z])[2]-rot([b.x,b.y,b.z])[2]).forEach(drawRoom);drawFlow(now);requestAnimationFrame(render)}requestAnimationFrame(render);
C.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.008;rx+=(e.clientY-ly)*.005;rx=Math.max(-.8,Math.min(.8,rx));lx=e.clientX;ly=e.clientY});C.addEventListener('wheel',e=>zoom=Math.max(.65,Math.min(1.8,zoom-e.deltaY*.001)),{passive:true});
let pinch=0;C.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});C.addEventListener('touchmove',e=>{if(e.touches.length===2){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(.65,Math.min(1.8,zoom+(n-pinch)*.003));pinch=n}},{passive:true});
document.getElementById('ex').onclick=()=>ex=!ex;document.getElementById('flow').onclick=()=>flow=!flow;document.getElementById('auto').onclick=()=>auto=!auto;document.getElementById('reset').onclick=()=>{ry=.25;rx=-.05;zoom=1;ex=false;flow=false;auto=false;cut.value=0};
})();
</script></body></html>
